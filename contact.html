<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cara - Contact</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f7fa;
    }

    header {
      background-color: #e3e6f3;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-family: cursive;
      color: #111;
      font-size: 28px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
      padding: 0;
      margin: 0;
    }

    nav ul li a {
      text-decoration: none;
      color: #111;
      font-weight: 500;
      position: relative;
    }

    nav ul li a:hover,
    nav ul li a.active {
      color: #088178;
    }

    .contact {
      max-width: 800px;
      margin: 40px auto;
      padding: 2rem;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .contact h2 {
      text-align: center;
      font-size: 32px;
      color: #222;
      margin-bottom: 1rem;
    }

    .contact p {
      font-size: 16px;
      margin: 0.5rem 0;
      text-align: center;
    }

    .contact form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 2rem;
    }

    .contact input,
    .contact textarea {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      resize: none;
    }

    .contact button {
      padding: 12px;
      border: none;
      background-color: #088178;
      color: white;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .contact button:hover {
      background-color: #065f5f;
    }

    .contact-icons {
      text-align: center;
      margin-top: 1rem;
    }

    .contact-icons i {
      font-size: 20px;
      margin: 0 10px;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <h1>Cara</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="about.html">About</a></li>
        <li><a class="active" href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="contact">
    <h2>Contact Us</h2>
    <p><i class="fa-solid fa-envelope"></i> support@cara.com</p>
    <p><i class="fa-solid fa-phone"></i> +91 12345 67890</p>

    <form>
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <textarea rows="4" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>

    <div class="contact-icons">
      <i class="fa-brands fa-facebook"></i>
      <i class="fa-brands fa-instagram"></i>
      <i class="fa-brands fa-twitter"></i>
    </div>
  </section>
</body>
</html>
